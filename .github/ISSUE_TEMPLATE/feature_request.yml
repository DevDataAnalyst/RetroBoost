name: Feature request
description: Suggest an idea to make RetroBoost more useful or more powerful
title: "[Idea] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have a look at the [roadmap](https://github.com/DevDataAnalyst/RetroBoost/blob/main/docs/ROADMAP.md) first: your idea may already be listed (and you can pick it up!).
        New cleanup category? Please use the **New cleanup category** form instead.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation, not just the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety considerations
      description: Could this delete or stop something it should not? How would we keep it safe (dry-run, plan screen, protection)?
  - type: dropdown
    id: help
    attributes:
      label: Could you help build it?
      options:
        - "Yes, I'd like to send a pull request"
        - "Maybe, with some guidance"
        - "No, I'm just suggesting"
    validations:
      required: true
