name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Syntax check and self-test (Windows, PowerShell 7)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse every PowerShell file
        shell: pwsh
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem -Recurse -Filter *.ps1) {
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errors)
            foreach ($e in $errors) {
              Write-Host "::error file=$($f.FullName),line=$($e.Extent.StartLineNumber)::$($e.Message)"
              $bad++
            }
          }
          if ($bad) { exit 1 }

      - name: Self-test (sandbox; no real files are touched)
        shell: pwsh
        run: ./tests/selftest.ps1
